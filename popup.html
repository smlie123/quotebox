<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuoteBox</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="content-styles.css">
  <link rel="stylesheet" href="iconfont/iconfont.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">Recent Saves</h1>
      <div class="actions">
        <button id="viewMoreBtn" class="btn"><i class="iconfont icon-home"></i> Home</button>
      </div>
    </header>
    
    
    
    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <span>Loading...</span>
    </div>
    
    <div id="articleList" class="article-list"></div>
    
    <div id="emptyState" class="empty-state hidden">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14,2 14,8 20,8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10,9 9,9 8,9"></polyline>
      </svg>
      <h3>No saved content yet</h3>
      <p>Select text on a webpage</p>
      <p>Right-click and choose "Save to QuoteBox" to start</p>
    </div>
  </div>
  
  <!-- Footer slogan -->
  <div class="slogan">
    <img src="icon48.png" alt="QuoteBox" style="width: 16px; height: 16px;">
    <span>QuoteBox，Save text, Keep ideas.</span>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
